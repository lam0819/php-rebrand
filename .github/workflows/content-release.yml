name: Content release

# Rebuild the single-source-of-truth SQLite manual from upstream (php/doc-en +
# php/web-php) and publish it as a release asset. Point `docs:pull` (or your
# deploy build command) at the artifact to install the latest content without
# cloning upstream.
#
# Usage:
#   git tag v1.2.0 && git push origin v1.2.0   # build + attach to the release
#   or run this workflow manually              # build + keep as a workflow artifact
#   or dispatch with a `tag` input (the daily Upstream check does this)

on:
  push:
    tags:
      - 'v*'
      - 'content-*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create/publish (empty = workflow artifact only)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: content-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build content database
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      # A tag push uses its tag; a manual/daily dispatch uses the `tag` input.
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
      PUBLISH: ${{ github.ref_type == 'tag' || github.event.inputs.tag != '' }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
        with:
          # Full history + tags so the release notes can list what changed.
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, dom, xml, xmlwriter, xmlreader, tokenizer, fileinfo, curl, sqlite3, pdo_sqlite, intl
          ini-values: memory_limit=-1
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare the environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi

      - name: Build the SQLite manual from upstream
        run: php artisan docs:build --fresh

      - name: Install the InlaySQL WASM engine
        run: bash scripts/inlaysql/install-wasm.sh

      - name: Build the browser search index
        run: php artisan search:build --fresh

      - name: Build release notes
        id: notes
        run: |
          set -euo pipefail

          docs_sha="$(git -C storage/app/php-doc-en rev-parse HEAD 2>/dev/null || echo unknown)"
          web_sha="$(git -C storage/app/php-web rev-parse HEAD 2>/dev/null || echo unknown)"
          pages="$(sqlite3 database/database.sqlite 'select count(*) from docs_pages;' 2>/dev/null || echo '?')"

          tag="${{ env.RELEASE_TAG }}"
          prev="$(git tag --sort=-creatordate | grep -vx "$tag" | head -1 || true)"

          if [ -n "$prev" ]; then
            changes="$(git log --pretty=format:'- %s (`%h`)' "${prev}..HEAD" | head -60 || true)"
            compare="https://github.com/${GITHUB_REPOSITORY}/compare/${prev}...${tag}"
            if [ -z "$changes" ]; then
              changelog="## What's changed

          Content refresh only — no application code changes in this release.

          [Full diff](${compare})"
            else
              changelog="## What's changed since \`${prev}\`

          ${changes}

          [Full diff](${compare})"
            fi
          else
            changelog="## What's changed

          $(git log --pretty=format:'- %s (`%h`)' -20)"
          fi

          title="$(git tag -l --format='%(contents:subject)' "$tag" 2>/dev/null || true)"
          if [ -z "$title" ]; then title="$tag"; fi
          printf '%s' "$title" > release-title.txt

          cat > release-notes.md <<EOF
          ${changelog}

          ## Content

          Rebuilt from the latest upstream sources:

          - \`php/doc-en\` @ \`${docs_sha}\`
          - \`php/web-php\` @ \`${web_sha}\`

          **${pages}** manual pages, plus the news archive and current releases.

          ## Artifacts

          - \`database.sqlite.gz\` — the manual, news and releases for the server.
          - \`manual-search.inlay.gz\` — the InlaySQL vector + BM25 index the browser downloads.

          ## Install

          \`\`\`bash
          php artisan docs:pull --force
          php artisan search:pull --force
          \`\`\`

          Content is parsed from upstream and **never hand-authored**. See [CONTRIBUTING.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CONTRIBUTING.md).
          EOF

          echo "----- release notes -----"
          cat release-notes.md

      - name: Package the artifacts
        run: |
          gzip -9 -c database/database.sqlite > database.sqlite.gz
          sha256sum database.sqlite.gz > database.sqlite.gz.sha256
          gzip -9 -c storage/app/manual-search.inlay > manual-search.inlay.gz
          sha256sum manual-search.inlay.gz > manual-search.inlay.gz.sha256
          ls -lh database.sqlite.gz manual-search.inlay.gz

      - name: Upload the workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: content-artifacts
          path: |
            database.sqlite.gz
            database.sqlite.gz.sha256
            manual-search.inlay.gz
            manual-search.inlay.gz.sha256
          retention-days: 14

      - name: Publish release assets
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ env.RELEASE_TAG }}"

          # The GitHub Releases API intermittently returns 500 — retry.
          retry() {
            local attempt=1
            until "$@"; do
              if [ "$attempt" -ge 5 ]; then
                echo "Command failed after $attempt attempts: $*" >&2
                return 1
              fi
              echo "Attempt $attempt failed; retrying in $((attempt * 5))s: $*" >&2
              sleep $((attempt * 5))
              attempt=$((attempt + 1))
            done
          }

          exists() {
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
          }

          # Note: a 500 from the create endpoint can still create the release,
          # so never blindly retry create — re-check and then upload.
          if ! exists; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$(cat release-title.txt)" --notes-file release-notes.md || true
          fi

          for _ in 1 2 3 4 5 6; do
            exists && break
            sleep 5
          done

          if ! exists; then
            echo "Release $tag could not be created." >&2
            exit 1
          fi

          # Keep the release body current even when the release already existed.
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --title "$(cat release-title.txt)" --notes-file release-notes.md || true

          echo "Uploading assets for $tag."
          retry gh release upload "$tag" --repo "$GITHUB_REPOSITORY" --clobber \
            database.sqlite.gz database.sqlite.gz.sha256 \
            manual-search.inlay.gz manual-search.inlay.gz.sha256

          echo "Published assets for $tag."

      # Optional: kick a Laravel Cloud deployment once the fresh artifact is
      # published. Set the environment's deploy hook URL as a repository secret
      # named LARAVEL_CLOUD_DEPLOY_HOOK (Settings > Secrets and variables >
      # Actions). The deploy hook has no CLI — enable it in Laravel Cloud under
      # Application > Environment > Settings > Deployments. With no secret set,
      # this step is a no-op.
      - name: Trigger Laravel Cloud deploy
        if: env.PUBLISH == 'true'
        env:
          DEPLOY_HOOK: ${{ secrets.LARAVEL_CLOUD_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "LARAVEL_CLOUD_DEPLOY_HOOK not set; skipping deployment."
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$DEPLOY_HOOK"
          echo "Triggered Laravel Cloud deployment."
